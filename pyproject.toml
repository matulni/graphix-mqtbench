[project]
name = "graphix-mqtbench"
version = "0.1.0"
description = "This plugin provides an interface between Graphix and the MQT Bench suite for benchmarking purposes."
readme = "README.md"
authors = [
    { name = "matulni", email = "m.uldemolins@gmail.com" }
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "graphix-qasm-parser>=0.1.1",
    "mqt-bench==2.2.2",
]

[project.optional-dependencies]
examples = [
    "pandas>=2.3, <3",
]
typing = [
    "qiskit==2.3.1",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mypy==1.19.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 120
exclude = [
  "examples",
  "__init__.py",
  "_version.py",
  "setup.py",
  "*.ipynb",]

[tool.ruff.lint]
preview = true
select = ["ALL"]
extend-ignore = [
  "C90",     # Complexity
  "E74",     # Ambiguous name
  "ERA",     # Commmented out code
  "FBT",     # Boolean positional arguments
  "FIX",     # Fixme
  "PLR091",  # Too many XXX
  "too-many-public-methods", # Too many public methods
  "magic-value-comparison", # Magic vavlue comparison
  "assert",    # assert
  "T20",     # print
  "TD",      # Todo

  # Tentative ignores
  "ANN",     # Missing annotations
  "CPY",     # Copyright
  "DOC",     # Docstring
  "line-too-long",    # Line too long
  "EM10",    # Raise string
  "too-many-nested-blocks", # Too many nests
  "eq-without-hash", # __hash__ missing
  "pytest-raises-too-broad",   # pytest raises too broad
  "private-member-access",  # Private access
  "raise-vanilla-args",  # Raise vanilla args

  # Conflicts with ruff format
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "docstring-tab-indentation",
  "triple-single-quotes",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "single-line-implicit-string-concatenation",
  "multi-line-implicit-string-concatenation",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "avoidable-escaped-quote",
  "tab-indentation",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.extend-per-file-ignores]

"tests/*.py" = [
  "D10",     # Allow undocumented items
  "import-private-name", # Allow private imports
  "no-self-use", # self not used
]

"benchmarks/*.py" = [
  "D10",     # Allow undocumented items
  "import-private-name", # Allow private imports
  "no-self-use", # self not used
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.pytest]
addopts = ["--ignore=examples", "--ignore=docs"]

[tool.mypy]
# Keep in sync with pyright
files = ["src", "tests"]
exclude = [
  "examples",
  "__init__.py",
  "_version.py",
  "setup.py"]
follow_imports = "silent"
follow_untyped_imports = true # required for qiskit, requires mypy >=1.14
strict = true
#mypy_path = "./stubs"

[tool.pyright]
# Keep in sync with mypy
include = ["src", "tests"]
exclude = [
  "examples",
  "__init__.py",
  "_version.py",
  "setup.py"]
reportUnknownArgumentType = "information"
reportUnknownLambdaType = "information"
reportUnknownMemberType = "information"
reportUnknownParameterType = "information"
reportUnknownVariableType = "information"
extraPaths = ["./stubs"]

[tool.uv.sources]
graphix-qasm-parser = { git = "https://github.com/matulni/graphix-qasm-parser.git", branch = "rnew-circuit-api" }
